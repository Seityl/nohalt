name: PR title

# Squash merges use the PR title as the commit message, and release-please
# reads commit messages to version and write the changelog -- so PR titles
# must be conventional commits: feat: ..., fix(scope): ..., docs: ...

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            ci
            build
            chore
            refactor
            perf
            revert
          requireScope: false
