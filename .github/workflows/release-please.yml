name: Release

# Conventional commits on main -> a release PR that bumps the version and
# CHANGELOG. Merging that PR tags the release and creates the GitHub release,
# then dispatches publish.yml to build and upload it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    # Dispatched, not called: PyPI trusted publishing matches the workflow that
    # runs (publish.yml); a reusable-workflow call would present the caller.
    # workflow_dispatch is the one event the built-in token may trigger.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: dispatch publish.yml for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" --ref main -f tag="$TAG"
